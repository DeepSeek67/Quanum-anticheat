name: CheatNeutraliser
version: ${version}
main: com.cheatneutraliser.CheatNeutraliser
api-version: '1.21'
author: CheatNeutraliser
website: https://github.com/DeepSeek67/Quanum-anticheat
description: Asynchronous packet-aware cheat neutralisation for Paper 1.21.x.
load: STARTUP
depend:
  - packetevents
commands:
  cheatneutraliser:
    description: CheatNeutraliser administration command
    usage: /cheatneutraliser <status|reload|debug>
    aliases: [cn]
    permission: cheatneutraliser.admin
permissions:
  cheatneutraliser.admin:
    description: Access CheatNeutraliser administration commands
    default: op
