# CheatNeutraliser - advanced multi-layer configuration
#
# Packet checks are only one layer. Client profiles change the sensitivity of
# corroborated behavioural anomalies; they do NOT claim to read client source code.

analysis:
  worker-threads: 2
  block-score: 90
  score-decay-per-second: 6
  max-packet-bytes: 2097152
  max-packets-per-second: 800
  burst-packets-per-100ms: 120

  # Advanced behavioural gates. These are intentionally conservative so ordinary
  # Minecraft movement/combat does not accumulate risk just by playing normally.
  same-packet-streak: 12
  ultra-fast-packet-nanos: 2000000
  require-corroboration: true

client-profiles:
  # Built-in behavioural sensitivity presets. Add several to combine their checks.
  enabled:
    - WURST
  additional-strictness-per-profile: 0.10
  metadata-independent: true

  # Optional server-side client/mod signals. These are evidence only and never the
  # sole reason for enforcement. A client can hide these signals, so behaviour remains active.
  protocol-signals:
    enabled: true
    known-channels:
      WURST:
        - "wurst"
        - "wurstclient"
      VAPE:
        - "vape"
      PRESTIGE:
        - "prestige"

neutralisation:
  enabled: true
  mode: NEUTRALISE
  block-malformed: true
  block-rate-limit: true
  block-impossible-packet-order: true

  # IMPORTANT: when true, CheatNeutraliser suppresses Bukkit kick events whose
  # reason clearly identifies a packet decoder/invalid-packet failure. The bad
  # packet is still not allowed into normal gameplay; the player simply is not kicked.
  intercept-invalid-packet-kicks: true

kick:
  # Completely separate from packet neutralisation. Default is OFF.
  enabled: false
  require-profile: true
  score-threshold: 95
  rejoin-delay-minutes: 5
  title:
    enabled: true
    text: "&b&lSECURITY"
  message: "&f[server] &b&lSecurity check triggered. Suspected profile: &e&l%profile%&f.\n&fYou may join again in &e%minutes% minutes&f."
  prefix: "&f[server]"

logging:
  console: true
  blocked-packets: true
  suspicious-packets: true
  debug: false
