# CheatNeutraliser v1.1 - multi-layer defensive engine
#
# The engine is behavioural and protocol-aware. Client names below select
# conservative rule profiles; they are NOT a claim that the server can read a
# player's client source code. Normal vanilla traffic must not accumulate risk.

analysis:
  worker-threads: 2

  # Risk is 0-100. A packet is only neutralised by the adaptive score when the
  # accumulated evidence reaches this value. Hard packet-path limits are checked
  # synchronously before Minecraft processes the packet.
  block-score: 90
  score-decay-per-second: 6

  # Protocol safety limits.
  max-packet-bytes: 2097152
  max-packets-per-second: 800
  burst-packets-per-100ms: 120

  # Behavioural correlation.
  same-packet-streak: 12
  ultra-fast-packet-nanos: 2000000
  minimum-independent-signals: 2

client-profiles:
  # Add as many profiles as wanted. Profiles combine only when their rules
  # independently match real anomalous behaviour.
  enabled:
    - WURST
    # - PRESTIGE
    # - VAPE
    # - IMPACT

  # Explicit rules make the system extensible without changing Java code.
  # Unknown rule names are ignored safely.
  rules:
    WURST:
      - movement-timing
      - interaction-burst
      - repeated-actions
      - high-action-rate
      - impossible-order
    PRESTIGE:
      - combat-timing
      - movement-timing
      - repeated-actions
      - high-action-rate
      - impossible-order
    VAPE:
      - combat-timing
      - repeated-actions
      - high-action-rate
      - impossible-order
    IMPACT:
      - movement-timing
      - interaction-burst
      - repeated-actions
      - impossible-order

  # Keep this independent from packet metadata. Hiding a client brand must not
  # disable behavioural analysis.
  metadata-independent: true

  # These are optional protocol-channel hints only. They are evidence, not proof.
  # Behavioural checks remain active if a client hides its metadata.
  protocol-signals:
    enabled: true
    known-channels:
      WURST:
        - "wurst"
        - "wurstclient"
      PRESTIGE:
        - "prestige"
      VAPE:
        - "vape"

neutralisation:
  enabled: true
  mode: NEUTRALISE

  # Immediate packet-path protections.
  block-malformed: true
  block-rate-limit: true
  block-impossible-packet-order: true

  # Suppress Bukkit invalid-packet kick events when possible. This does NOT
  # magically prevent a disconnect performed below Bukkit by the network stack.
  intercept-invalid-packet-kicks: true

  # Never punish solely because a configured client profile exists.
  require-behavioural-evidence: true

kick:
  # OFF by default. Set true AND mode: KICK if server owners explicitly want
  # enforcement after the behavioural threshold is reached.
  enabled: false
  require-profile: true
  score-threshold: 95
  rejoin-delay-minutes: 5

  title:
    enabled: true
    text: "&b&lSECURITY"

  prefix: "&f[server]"
  message: "&f[server] &b&lSecurity check triggered. Suspected profile: &e&l%profile%&f.\n&fYou may join again in &e%minutes% minutes&f."

logging:
  console: true
  blocked-packets: true
  suspicious-packets: true
  debug: false
