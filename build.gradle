plugins {
    id 'java'
    id 'com.gradleup.shadow' version '8.3.8'
}

group = 'com.cheatneutraliser'
version = '1.0.0'

description = 'Asynchronous packet-aware cheat neutralisation for Paper servers'

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

repositories {
    maven { url = uri('https://repo.papermc.io/repository/maven-public/') }
    mavenCentral()
    maven { url = uri('https://repo.codemc.io/repository/maven-releases/') }
    maven { url = uri('https://repo.codemc.io/repository/maven-snapshots/') }
}

dependencies {
    compileOnly('io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT')
    implementation('io.github.retrooper.packetevents:packetevents-spigot:2.13.0')
}

compileJava {
    options.encoding = 'UTF-8'
    options.release = 21
}

processResources {
    filteringCharset = 'UTF-8'
    filesMatching('plugin.yml') {
        expand(version: project.version)
    }
}

shadowJar {
    archiveClassifier.set('')
    relocate('com.github.retrooper.packetevents', 'com.cheatneutraliser.libs.packetevents')
    relocate('io.github.retrooper.packetevents', 'com.cheatneutraliser.libs.packetevents')
}

tasks.named('build') {
    dependsOn(tasks.named('shadowJar'))
}
